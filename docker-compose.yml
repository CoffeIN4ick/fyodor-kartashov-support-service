services:
  db:
    image: postgres:16-alpine
    container_name: fyodor_kartashov_postgres
    environment:
      POSTGRES_DB: fyodor_kartashov
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - fyodor_kartashov_pgdata:/var/lib/postgresql/data

volumes:
  fyodor_kartashov_pgdata: